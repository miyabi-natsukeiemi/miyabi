<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omamori Concierge — Фукуока</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=PT+Mono&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16181A; --indigo:#1E3050; --indigo-soft:#43536B; --seal:#B3352D; --bg:#FCFCFA; --body2:#2E3338; --line:rgba(22,24,26,.14);}
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif}
  .mono{font-family:'PT Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--indigo-soft)}
  h1{font-family:'Cormorant Garamond',serif; font-weight:600; margin:0; font-size:44px}
  header{display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line)}
  header .seal{width:26px; height:26px; border-radius:7px; background:var(--seal); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px}
  header a{color:var(--ink); text-decoration:none; font-size:14px}
  header a:hover{color:var(--seal)}
  main{max-width:640px; margin:0 auto; padding:120px 24px; text-align:center}
  main p{color:var(--body2); font-size:16px; line-height:1.7; margin-top:16px}
  .back{display:inline-block; margin-top:36px; font-size:13px; padding:10px 20px; border:1px solid var(--indigo); color:var(--indigo); text-decoration:none}
  .back:hover{background:var(--indigo); color:#fff}
</style>
</head>
<body>
<header>
  <span class="seal" aria-hidden="true">御</span>
  <a href="index.html">← Omamori Concierge</a>
</header>
<main>
  <span class="mono">Направление</span>
  <h1>Фукуока</h1>
  <p>Страница готовится — скоро здесь появится подробный гид по районам, ресторанам и маршрутам.</p>
  <a class="back" href="index.html#map-section">← Ко всей карте Японии</a>
</main>
</body>
</html>
