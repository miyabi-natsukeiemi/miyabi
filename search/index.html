.sr-count{margin:36px 0 8px;font-size:15px;color:var(--mute)}
.sr-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line2)}
.sr-list li{border-bottom:1px solid var(--line2)}
.sr-list a{display:grid;grid-template-columns:148px minmax(0,1fr);gap:24px;padding:22px 0;text-decoration:none;color:var(--ink)}
.sr-list img,.sr-list .ph{width:148px;height:100px;object-fit:cover;border-radius:6px;background:var(--board)}
.sr-meta{font-size:13px;color:var(--mute)}

<script>
(function(){
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('.themes button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.theme === t ? 'true' : 'false'); });
    try { localStorage.setItem('miyabi-theme', t); } catch(e){}
  }
  document.querySelectorAll('.themes button').forEach(function(b){ b.addEventListener('click', function(){ setTheme(b.dataset.theme); }); });
  setTheme(document.documentElement.getAttribute('data-theme') || 'washi');
})();
</script>
<script src="/assets/search.js"></script>
<script>
(function(){
  var q = document.getElementById('q'), pref = document.getElementById('pref'), cats = document.getElementById('cats');
  var list = document.getElementById('list'), count = document.getElementById('count'), more = document.getElementById('more');
  var cat = '', shown = 0, res = [], STEP = 30;
  var P = new URLSearchParams(location.search);
  q.value = P.get('q') || ''; cat = P.get('cat') || '';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function plural(n){ var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'статья' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'статьи' : 'статей'; }
  function item(e){
    var meta = e.k === 'g' ? 'Путеводитель по префектуре · ' + e.pn : e.pn + (e.g ? ' · ' + e.g : '');
    var img = e.i ? '<img src="' + esc(e.i) + '" alt="" loading="lazy">' : '<span class="ph"></span>';
    return '<li><a href="' + esc(e.u) + '">' + img + '<div><span class="sr-meta">' + esc(meta) + '</span><h2>' + esc(e.t) + '</h2>' +
      (e.l ? '<p>' + esc(e.l) + '</p>' : '') + '</div></a></li>';
  }
  function page(){
    list.insertAdjacentHTML('beforeend', res.slice(shown, shown + STEP).map(item).join(''));
    shown = Math.min(res.length, shown + STEP);
    more.hidden = shown >= res.length;
  }
  function run(){
    var text = q.value.trim();
    res = OmSearch.find(text, { pref: pref.value, cat: cat });
    if (!text && !pref.value && !cat) res = res.filter(function(e){ return e.k === 'g'; });  // nothing chosen: the 47 guides
    list.innerHTML = ''; shown = 0;
    var n = res.filter(function(e){ return e.k === 'a'; }).length;
    count.textContent = res.length ? (!text && !pref.value && !cat ? 'Путеводители по 47 префектурам. Начните вводить название или выберите тему.' :
      'Нашлось: ' + n + ' ' + plural(n) + (res.length > n ? ' и путеводитель по префектуре' : '')) :
      '';
    if (!res.length) list.innerHTML = '<li class="sr-empty">Ничего не нашлось. Попробуйте другое написание или уберите фильтр. Или напишите нам — подскажем, куда поехать.</li>';
    page();
    var u = new URLSearchParams();
    if (text) u.set('q', text); if (pref.value) u.set('pref', pref.value); if (cat) u.set('cat', cat);
    history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
  }
  var t = null;
  q.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(run, 120); });
  pref.addEventListener('change', run);
  more.addEventListener('click', page);
  OmSearch.load().then(function(d){
    d.prefs.forEach(function(p){ var o = document.createElement('option'); o.value = p.p; o.textContent = p.n; pref.appendChild(o); });
    pref.value = P.get('pref') || '';
    var all = [['', 'Все темы']].concat(Object.keys(d.cats).map(function(k){ return [k, d.cats[k]]; }));
    all.forEach(function(c){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = c[1]; b.dataset.cat = c[0];
      b.setAttribute('aria-pressed', c[0] === cat ? 'true' : 'false');
      b.addEventListener('click', function(){
        cat = c[0]; cats.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.cat === cat ? 'true' : 'false'); });
        run();
      });
      cats.appendChild(b);
    });
    run();
  }).catch(function(){ count.textContent = 'Не удалось загрузить поиск. Обновите страницу.'; });
})();
</script>
